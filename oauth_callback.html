<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication — Claude</title>
  <style>
    :root {
      --bg: #f9f5ef;
      --fg: #1a1a1a;
      --accent: #d97706;
      --success: #16a34a;
      --error: #dc2626;
      --muted: #6b7280;
      --card: #ffffff;
      --border: #e5e1db;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1715;
        --fg: #e5e1db;
        --card: #262220;
        --border: #3d3835;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    p {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .success h1 { color: var(--success); }
    .error h1 { color: var(--error); }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status { transition: opacity 0.2s; }
  </style>
</head>
<body>
  <div class="card" id="status">
    <div class="spinner"></div>
    <h1>Completing authentication…</h1>
    <p>Please wait while your session is verified.</p>
  </div>
  <script src="oauth_callback.js"></script>
</body>
</html>
